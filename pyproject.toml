[project]
name = "markethistorydb"
version = "0.1.0"
description = "Creates and manages database for historical exchange market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "questdb>=5.0.0",
    "requests>=2.34.2",
]

[project.scripts]
markethistorydb = "markethistorydb.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests that fake the eodhd.com API and the database",
    "integration: tests that run against a real QuestDB",
    "live: tests that call the real eodhd.com API, spending calls of EODHD_API_TOKEN's account; -m 'not live' leaves them out",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "_test.py"
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
    '@(abc\.)?abstractmethod',
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
